plugins {
    id 'com.android.application'
}

// Release signing reads keystore.properties, which is never committed. See README.
def keystoreFile = rootProject.file('keystore.properties')
def keystore = new Properties()
if (keystoreFile.exists()) keystoreFile.withInputStream { keystore.load(it) }

android {
    namespace 'com.kun.pixelwords'
    compileSdk 36

    defaultConfig {
        applicationId 'com.kun.pixelwords'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystore['storeFile'])
                storePassword keystore['storePassword']
                keyAlias keystore['keyAlias']
                keyPassword keystore['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Sprite sheets and word lists are read straight from assets; don't waste time compressing them.
    androidResources {
        noCompress 'png', 'txt', 'json', 'wav'   // SoundPool needs wav files stored uncompressed
    }
}

dependencies {
    implementation project(':core')

    // Google Play services. Version numbers are starting points: check for the latest releases.
    implementation 'com.google.android.gms:play-services-games-v2:20.1.0'   // sign-in, leaderboards, cloud save
    implementation 'com.google.android.gms:play-services-ads:25.5.0'        // AdMob rewarded videos and ad breaks
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'   // ad consent
    implementation 'com.android.billingclient:billing:9.1.0'                // in-app purchases
}
